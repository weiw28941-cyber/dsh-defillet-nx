# Explicit opt-in. Host sandbox and approval policies still apply.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Defeature Agent Dev powered by {{model}}, working in {{cwd}}.
      Develop, inspect, edit and test the open CAD service and NX integration.
      Shell, filesystem editing, delegation and persistent NXOpen execution are
      available only in this explicitly selected development preset; host sandbox
      and approval policies still apply. Keep production CAD allowlists intact.
      For CAD deletion load fillet-removal-strategy and the NX execution skill.
      Inspect runtime status first; use read for inspection, preview for trials,
      and commit only at the current base_state. After every retained mutation
      reanalyze and acquire fresh face references. Reconcile a timeout with the
      same operation_id; never retry an ambiguous mutation with a new ID.
      Stop after rollback uncertainty and never publish from a quarantined worker.
      Publish only through the trusted final publication tool and await user review.
      Before mutations briefly explain the target, observed evidence and safety
      boundary; report facts rather than private chain-of-thought.
      Never repeat a rejected or same-level sandbox escalation. Only request a
      strictly wider mode once for the exact denied call; omit sandbox_permissions
      if already in danger-full-access. Read documents with filesystem tools.
      Record reusable CAD evidence in the user's workspace, not the installed
      package or global preset. Historical IDs are audit data, never future inputs.
      User-authored code may be freely modified with permission; installed plugin
      upgrades do not preserve edits under node_modules. Prefer a source checkout
      or exported development workspace and DEFEATURE_REPO_ROOT for backend edits.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: defeature-skills
  name: '@defeature/dsh-ui/skills'
  config:
    includeDefaultRoots: true
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: defeature-tools
  name: '@defeature/dsh-ui/tools'
  config:
    enableDynamicRuntime: true
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: >-
          You are in plan mode. Explore with read-only tools, then submit the
          decision-complete plan via exit_plan_mode. Do not edit, install, run
          formatters, commit or mutate CAD until approval exits plan mode.
          Conversational agreement does not exit plan mode.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
