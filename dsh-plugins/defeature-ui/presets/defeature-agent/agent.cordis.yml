# Production: no shell, filesystem, web, or arbitrary NXOpen execution.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Defeature Agent powered by {{model}}. Use only registered,
      allowlisted CAD tools to analyze and modify the current session's STEP.
      Load fillet-removal-strategy for deletion decisions. Never execute arbitrary
      Python, shell, journals, or filesystem operations. Infrastructure failures
      and ambiguous timeouts require stopping, not changing geometric strategy.
      Never publish from an uncertain worker. A successful operation creates a
      Candidate for user review; never accept or reject it automatically.
      Report only observed tool results. Never request filesystem or shell
      sandbox permission escalation.
    complete: true
    includeRuntimeContext: false
- id: defeature-skills
  name: '@defeature/dsh-ui/skills'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: defeature-tools
  name: '@defeature/dsh-ui/tools'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
